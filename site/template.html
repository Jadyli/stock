</div></header>

<div class="content-layout"><main class="content" id="main">[[CONTENT]]<footer class="footer"><p>[[WARNING]]</p><p class="build-time">网站构建时间：[[GENERATED]]。行情与资讯截止时间以各篇报告正文为准。</p></footer></main><aside class="outline" aria-label="本页目录"><h2>本页目录</h2>[[TOC]]</aside></div></div>
<dialog id="search-dialog" aria-label="全文搜索报告"><div class="search-head"><input id="search-input" type="search" placeholder="搜索股票名称、代码、板块或关键词…" aria-label="搜索关键词" autocomplete="off"><button id="search-close" type="button">关闭</button></div><div id="search-status" class="search-status" role="status" aria-live="polite">输入关键词，搜索全部已发布报告。</div><div id="search-results" class="search-results"></div><div class="search-foot">全文搜索 · 多个关键词以空格分隔 · Esc 关闭</div></dialog>
<script>
(()=>{
'use strict';
const root=document.documentElement,base=document.body.dataset.base;
document.querySelector('.theme-toggle').addEventListener('click',()=>{const theme=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=theme;try{localStorage.setItem('stock-theme',theme)}catch(e){}});
const menu=document.querySelector('.menu-toggle'),side=document.getElementById('sidebar');
menu.addEventListener('click',()=>{const open=side.classList.toggle('mobile-open');menu.setAttribute('aria-expanded',String(open))});
document.addEventListener('click',event=>{if(side.classList.contains('mobile-open')&&!side.contains(event.target)&&!menu.contains(event.target)){side.classList.remove('mobile-open');menu.setAttribute('aria-expanded','false')}});
document.getElementById('print-report')?.addEventListener('click',()=>window.print());
const dialog=document.getElementById('search-dialog'),input=document.getElementById('search-input'),status=document.getElementById('search-status'),results=document.getElementById('search-results');
function openSearch(){if(!dialog.open)dialog.showModal();input.focus()}
document.querySelector('.search-open').addEventListener('click',openSearch);
document.getElementById('search-close').addEventListener('click',()=>dialog.close());
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch()}});
let indexPromise=null,generation=0,timer;
function loadIndex(){if(!indexPromise)indexPromise=fetch(base+'search-index.json',{cache:'no-cache'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).catch(error=>{indexPromise=null;throw error});return indexPromise}
async function search(){
const current=++generation,query=input.value.trim().toLocaleLowerCase(),terms=query.split(/\s+/u).filter(Boolean);
results.replaceChildren();if(!terms.length){status.textContent='输入关键词，搜索全部已发布报告。';return}
status.textContent='正在搜索…';
try{
const index=await loadIndex();if(current!==generation)return;
const matches=index.map(item=>{const haystack=(item.title+' '+item.category+' '+item.date+' '+item.text).toLocaleLowerCase();const score=terms.every(term=>haystack.includes(term))?terms.reduce((total,term)=>total+(item.title.includes(term)?6:1),0):0;return{item,score}}).filter(hit=>hit.score>0).sort((a,b)=>b.score-a.score||b.item.date.localeCompare(a.item.date));
status.textContent=matches.length?`找到 ${matches.length} 篇报告${matches.length>40?'，展示前 40 篇，请增加关键词缩小范围':''}`:'没有匹配的报告。可尝试股票代码、较短关键词或其他日期。';
for(const{item}of matches.slice(0,40)){
const link=document.createElement('a');link.className='search-result';
// Only allow links within this site's own deployment prefix.
if(typeof item.url!=='string'||!item.url.startsWith(base)||item.url.startsWith('//'))continue;
link.href=item.url;const title=document.createElement('strong'),meta=document.createElement('small'),snippet=document.createElement('p');
title.textContent=item.title;meta.textContent=item.category+' · '+item.date;
const text=String(item.text||''),position=Math.max(0,text.toLocaleLowerCase().indexOf(terms[0])),start=Math.max(0,position-35);
snippet.textContent=(start?'…':'')+text.slice(start,start+155)+(text.length>start+155?'…':'');
link.append(title,meta,snippet);results.append(link);
}
}catch(error){if(current===generation)status.textContent='搜索索引暂时无法读取，请刷新后重试。文章和月份目录仍可正常浏览。'}
}
input.addEventListener('input',()=>{generation++;clearTimeout(timer);timer=setTimeout(search,180)});
input.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();results.querySelector('a')?.focus()}});
})();
</script>
